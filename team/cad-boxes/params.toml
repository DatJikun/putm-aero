# Parametry auta dla generatora boxów aero (gen_boxes.py). Jednostki: mm.
#
# Układ współrzędnych = jak w modelu CFD / złożeniu PM09-Model-CFD.SLDASM:
#   x  do tyłu, 0 = oś przednia
#   y  w bok,   0 = płaszczyzna symetrii (półauto w CFD leży po stronie y < 0); niżej podajemy |y|
#   z  w górę,  0 = grunt
#
# Źródła:
#   [CFD]    team/fluent-scripts/solving.jou
#   [KOLEGA] część REF-REGULATIONS-2027 (team/cad-boxes/ref-kolegi/) — jego boxy mają zapas 10 mm,
#            tu wpisane wartości PO cofnięciu tego zapasu (≈, do potwierdzenia pomiarem w złożeniu)

[car]
wheelbase = 1530.0            # [CFD] oś tylnego koła x = 1.53 m; [KOLEGA] keep-out 1239.25…1820.75
tire_radius_front = 205.75    # [CFD] oś koła z = 0.20574 m; [KOLEGA] 205.75
tire_radius_rear = 205.75

# Krawędzie opon jako |y| od osi auta (most inboard / most outboard point)
y_inner_front = 490.0         # [KOLEGA] keep-out przedniego koła od |y| = 480 (+10 zapasu)
y_outer_front = 700.0         # [KOLEGA] box nisko do |y| = 690 (+10 zapasu)  ← do potwierdzenia
y_inner_rear = 467.3          # [KOLEGA] keep-out tylnego koła od |y| = 457.3 (+10 zapasu)
y_outer_rear = 662.0          # [KOLEGA] RW 700–1100 do |y| = 652 (+10 zapasu)

# x przedniej ściany podpory zagłówka (most rearward, bez padów) — T 8.2.1
x_head_restraint = 1110.75    # [KOLEGA] boxy za HR zaczynają się na x = 1120.75 (−10 zapasu)

[model]
# Zapas bezpieczeństwa: strefy dozwolone mniejsze o tyle, keep-outy większe. 0 = gołe limity regulaminu.
margin = 10.0
# Interpretacja T 8.2.2 b1 („a vertical plane touching the most outboard point of the front and rear wheel/tire”):
#   "taper"    – jedna płaszczyzna styczna do obu opon → zbieżna do tyłu, gdy krawędzie przód ≠ tył (ostrożniej)
#   "parallel" – równoległa do osi auta przez bardziej zewnętrzną oponę (tak zrobił kolega)
width_plane_mode = "taper"
# Minimalny prześwit (T 2.2.1) — dolna ściana stref dozwolonych
ground_clearance = 30.0
# Strefy, które regulamin opisuje jako „bez końca", są w CAD obcinane:
keepout_lateral_extra = 150.0  # ile mm outboard od zewn. krawędzi opony rysować keep-out
keepout_height_cap = 1100.0    # wysokość keep-out przednich kół (reguła: bez limitu; aero i tak < 1100)
front_outboard_extra = 150.0   # szara strefa B3: aero przed LE opon outboard od opony (T 8.2.2 milczy)
